services:
  jenkins:
    image: panabaev-alisher-jenkins:local
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    container_name: panabaev-alisher-jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"

volumes:
  jenkins_home:
